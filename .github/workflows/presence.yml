name: presence

# Record what this window can already honestly say about its own readership.
#
# The Observer ships no analytics and SECURITY.md says so in public. Nothing
# here changes that: no script is added to the page, nothing about a reader is
# collected, and this job only reads the number /api/presence already publishes
# to anybody who asks. See tools/presence-sample.mjs for the full reasoning.
#
# The series is written to the `presence-data` branch, NOT to main and NOT into
# site/. Two deliberate reasons:
#
#   - main is protected (review required, linear history). CI cannot push to it,
#     and it should not be able to.
#   - site/ is the deploy output. A commit there every ten minutes would mean
#     144 production deploys a day of a page that did not change.
#
# So the data lives beside the code, publicly auditable, and touches neither.

# TWELVE DAILY ENTRIES INSTEAD OF `*/15`, AND THE SERIES IS WHY.
#
# This ran on `*/15` — 96 fires a day on paper. What was delivered, measured
# from the series itself:
#
#   2026-08-26   22 fires   18 distinct UTC hours covered
#   2026-08-27    3 fires    4 distinct UTC hours
#   2026-08-28    2 fires    2 distinct UTC hours   (to 14:41Z)
#
# The first day is the best this schedule has ever done, and it is 23% of the
# nominal rate. The two days after it are 2-3%. High-frequency crons on public
# repos are dropped under load rather than queued, and the drop rate is not
# stable enough to plan around.
#
# THE PREVIOUS FIX WAS THE WRONG SHAPE AND THIS COMMENT USED TO ARGUE FOR IT.
# It said: since the run is scarce, make a fired run carry five samples three
# minutes apart, and that "restores roughly the original resolution from a fifth
# of the runs". It does not. Five samples inside a 13.7-minute window are five
# readings of one moment; they multiply the row count while telling you nothing
# about the other 23 hours. On 2026-08-28 that produced 10 records — close to
# 08-26's 22 — from 2 hours of the day instead of 18. Resolution is spread, and
# density is not a substitute for it. tools/presence-report.mjs now measures
# coverage as distinct hours rather than record count, which is what makes the
# table above readable at all.
#
# So: buy spread with cron ENTRIES, which are the reliable kind on this account
# (a daily entry on the sibling `coverage` workflow has fired ten days running,
# consistently 45-70 minutes late but never missing), and use in-run samples
# only to bridge between entries rather than to stand in for them.
#
# THIS IS A HYPOTHESIS AND THE SERIES WILL SETTLE IT. Nothing has been measured
# at twelve entries a day; the measured points are 1/day (reliable) and 96/day
# (2-23%). If the next seven days do not clear roughly 12 of 24 hours, then
# "frequency is what gets dropped" is the wrong explanation, and the honest
# response is to say so rather than to add more entries.
on:
  schedule:
    - cron: "7 0 * * *"
    - cron: "7 2 * * *"
    - cron: "7 4 * * *"
    - cron: "7 6 * * *"
    - cron: "7 8 * * *"
    - cron: "7 10 * * *"
    - cron: "7 12 * * *"
    - cron: "7 14 * * *"
    - cron: "7 16 * * *"
    - cron: "7 18 * * *"
    - cron: "7 20 * * *"
    - cron: "7 22 * * *"
  workflow_dispatch:

# Overlapping runs would race on the same append. Let a slow run finish rather
# than cancelling it — a dropped sample is a gap, and gaps are visible in the
# coverage column of the report.
concurrency:
  group: presence-series
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tools
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # No `npm ci`. There are no dependencies and keeping it that way is an
      # invariant, not a preference — same rule the coverage workflow asserts.
      #
      # TWO SAMPLES, THIRTY MINUTES APART, AND THE GAP IS THE POINT.
      #
      # Thirty minutes is chosen so that a run beginning anywhere in an hour
      # touches two hour-buckets more often than one, which is the only thing
      # that moves the coverage column. It is not chosen to raise the row count;
      # rows were never the scarce thing.
      #
      # The cost is honest and worth writing down: this leaves a runner idle for
      # half an hour, twelve times a day. Public-repo minutes are free, but they
      # are somebody's machines. If the coverage bar turns out to be reachable
      # with one sample per entry, drop the second and reclaim them.
      - name: Sample the presence endpoint
        run: |
          : > records.jsonl
          for i in 1 2; do
            if [ "$i" -gt 1 ]; then sleep 1800; fi
            # The sampler exits non-zero when EVERY attempt failed, but it still
            # prints the record. Keep it: an outage is data, and dropping it
            # would leave a gap that reads as a quiet period.
            node tools/presence-sample.mjs >> records.jsonl || echo "note: sample $i fully failed; recorded as such"
          done
          wc -l < records.jsonl
          cat records.jsonl

      - name: Check out the data branch
        uses: actions/checkout@v4
        with:
          ref: presence-data
          path: series

      - name: Append and push
        run: |
          cd series
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cat ../records.jsonl >> presence-history.jsonl
          git add presence-history.jsonl

          # Pull the timestamps with sed rather than node. package.json sets
          # "type": "module", which makes `node -p` inline CommonJS a coin flip
          # not worth tossing inside a cron job nobody watches.
          FIRST=$(sed -n 's/.*"at":"\([^"]*\)".*/\1/p' ../records.jsonl | head -1)
          N=$(wc -l < ../records.jsonl | tr -d ' ')
          git commit -m "presence: ${N:-?} sample(s) from ${FIRST:-unparsed timestamp}"

          # A concurrent run may have appended first. Rebase and retry rather
          # than force — losing somebody else's sample to win a race would put a
          # hole in the series that nothing downstream could detect.
          for attempt in 1 2 3 4 5; do
            if git push origin presence-data; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected, rebasing (attempt $attempt)"
            git pull --rebase origin presence-data
          done

          echo "could not append the sample after 5 attempts"
          exit 1
